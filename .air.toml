#:schema https://json.schemastore.org/any.json

# Live-reload loop for development: `air` (https://github.com/air-verse/air)
# Rebuilds ./tmp/llamadeck and restarts the server on every .go save.

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/llamadeck ./cmd/server"
entrypoint = ["./tmp/llamadeck"]
full_bin = "LLAMADECK_CONFIG_PATH=llamadeck.dev.yaml ./tmp/llamadeck"
send_interrupt = true
kill_delay = "3s"
stop_on_error = false
delay = 500

include_ext = ["go"]
