name: WebUI Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - "webui/**"
      - ".github/workflows/webui_test.yaml"
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webui


    steps:
    - uses: actions/checkout@v4
