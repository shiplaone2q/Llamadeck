basePath: /api/v1
definitions:
  auth.PermissionMode:
    enum:
    - allow_all
    - per_instance
    type: string
    x-enum-varnames:
    - PermissionModeAllowAll
    - PermissionModePerInstance
  config.AppConfig:
    properties:
      auth:
        $ref: '#/definitions/config.AuthConfig'
      backends:
        $ref: '#/definitions/config.BackendConfig'
      build_time:
        type: string
      commit_hash:
        type: string
      data_dir:
        description: Directory where all llamadeck data will be stored (database, instances,
          logs, etc.)
        type: string
      database:
        $ref: '#/definitions/config.DatabaseConfig'
      instances:
        $ref: '#/definitions/config.InstancesConfig'
      local_node:
        type: string
      nodes:
        additionalProperties:
          $ref: '#/definitions/config.NodeConfig'
        type: object
      server:
        $ref: '#/definitions/config.ServerConfig'
      version:
        type: string
    type: object
  config.AuthConfig:
    properties:
      management_keys:
        description: List of keys for management endpoints
        items:
          type: string
        type: array
      oidc:
        allOf:
        - $ref: '#/definitions/config.OIDCConfig'
        description: OpenID Connect login for the WebUI (optional)
      require_inference_auth:
        description: Require authentication for OpenAI compatible inference endpoints
        type: boolean
      require_management_auth:
        description: Require authentication for management endpoints
        type: boolean
    type: object
  config.BackendConfig:
    properties:
      custom:
        additionalProperties:
          $ref: '#/definitions/config.BackendSettings'
        type: object
      llama-cpp:
        $ref: '#/definitions/config.BackendSettings'
      mlx:
        $ref: '#/definitions/config.BackendSettings'
      vllm:
        $ref: '#/definitions/config.BackendSettings'
    type: object
  config.BackendSettings:
    properties:
      args:
        items:
          type: string
        type: array
      cache_dir:
        type: string
      command:
        type: string
      docker:
        $ref: '#/definitions/config.DockerSettings'
      download_timeout:
        example: 3600s
        type: string
      environment:
        additionalProperties:
          type: string
        type: object
      health_path:
        type: string
      response_headers:
        additionalProperties:
          type: string
        type: object
    type: object
  config.DatabaseConfig:
    properties:
      connection_max_lifetime:
        example: 1h
        type: string
      max_idle_connections:
        type: integer
      max_open_connections:
        description: Connection settings
        type: integer
      path:
        description: Database file path (relative to the top-level data_dir or absolute)
        type: string
    type: object
  config.DockerSettings:
    properties:
      args:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      environment:
        additionalProperties:
          type: string
        type: object
      image:
        type: string
    type: object
  config.InstancesConfig:
    properties:
      auto_create_dirs:
        description: Automatically create the data directory if it doesn't exist
        type: boolean
      default_auto_restart:
        description: Default auto-restart setting for new instances
        type: boolean
      default_idle_timeout:
        description: Default idle timeout for instances in minutes (0 means no timeout)
        type: integer
      default_max_restarts:
        description: Default max restarts for new instances
        type: integer
      default_on_demand_start:
        description: Default on-demand start setting for new instances
        type: boolean
      default_restart_delay:
        description: Default restart delay for new instances (in seconds)
        type: integer
      enable_lru_eviction:
        description: Enable LRU eviction for instance logs
        type: boolean
      group_limits:
        additionalProperties:
          type: integer
        description: Group-specific limits for running instances (group name -> max
          count)
        type: object
      instances_dir:
        description: Instances directory for instance working directories (preset.ini,
          etc.)
        type: string
      logRotationCompress:
        default: false
        description: Whether to compress rotated log files
        type: boolean
      logRotationEnabled:
        default: true
        description: Log rotation enabled
        type: boolean
      logRotationMaxSize:
        default: 100
        description: Maximum log file size in MB before rotation
        type: integer
      logs_dir:
        description: Logs directory override (relative to data_dir if not absolute)
        type: string
      max_instances:
        description: Maximum number of instances that can be created
        type: integer
      max_running_instances:
        description: Maximum number of instances that can be running at the same time
        type: integer
      on_demand_start_timeout:
        description: How long to wait for an instance to start on demand (in seconds)
        type: integer
      port_range:
        description: Port range for instances (e.g., 8000,9000)
        items:
          type: integer
        type: array
      timeout_check_interval:
        description: Interval for checking instance timeouts (in minutes)
        type: integer
    type: object
  config.NodeConfig:
    properties:
      address:
        type: string
      api_key:
        type: string
    type: object
  config.OIDCConfig:
    properties:
      allowed_groups:
        description: |-
          Groups allowed to log in, matched against the groups claim. Empty =
          every user the IdP authenticates is allowed (current behavior).
        items:
          type: string
        type: array
      client_id:
        description: OAuth2 client ID registered with the IdP
        type: string
      client_secret:
        description: OAuth2 client secret
        type: string
      groups_claim:
        description: |-
          Name of the ID-token claim carrying the user's groups (default: "groups").
          Override for IdPs that expose membership under a different claim (e.g. "roles").
        type: string
      issuer_url:
        description: Issuer URL of the IdP, e.g. https://authentik.example/application/o/llamadeck/
        type: string
      redirect_url:
        description: |-
          Redirect URL override; derived from the request when empty. Set this
          when running behind a TLS-terminating proxy that does not forward
          X-Forwarded-Proto/X-Forwarded-Host, or when serving under a subpath.
        type: string
      scopes:
        description: 'Scopes requested from the IdP (default: openid, profile, email)'
        items:
          type: string
        type: array
      secure_cookie:
        description: Mark the session cookie Secure; disable only on plain-HTTP LAN
          deployments
        type: boolean
      session_ttl:
        description: 'Session lifetime (default: 12h)'
        example: 12h
        type: string
    type: object
  config.ServerConfig:
    properties:
      allowed_headers:
        description: Allowed headers for CORS (e.g., "Accept", "Authorization", "Content-Type",
          "X-CSRF-Token")
        items:
          type: string
        type: array
      allowed_origins:
        description: Allowed origins for CORS (e.g., "http://localhost:3000")
        items:
          type: string
        type: array
      enable_swagger:
        description: Enable Swagger UI for API documentation
        type: boolean
      host:
        description: Server host to bind to
        type: string
      port:
        description: Server port to bind to
        type: integer
      response_headers:
        additionalProperties:
          type: string
        description: Response headers to send with responses
        type: object
    type: object
  instance.Instance:
    properties:
      created:
        description: Unix timestamp when instance was created
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  instance.Options:
    properties:
      auto_restart:
        description: Auto restart
        type: boolean
      command_override:
        type: string
      docker_enabled:
        description: Execution context overrides
        type: boolean
      environment:
        additionalProperties:
          type: string
        description: Environment variables
        type: object
      group:
        description: Instance group for hierarchical eviction
        type: string
      idle_timeout:
        description: Idle timeout
        type: integer
      max_restarts:
        type: integer
      on_demand_start:
        description: On demand start
        type: boolean
      preset_ini:
        description: Preset configuration
        type: string
      restart_delay:
        description: seconds
        type: integer
    type: object
  models.CachedModel:
    properties:
      files:
        items:
          $ref: '#/definitions/models.File'
        type: array
      node:
        type: string
      repo:
        type: string
      size_bytes:
        type: integer
      tag:
        type: string
    type: object
  models.File:
    properties:
      name:
        type: string
      path:
        type: string
      size_bytes:
        type: integer
      type:
        type: string
    type: object
  models.ModelFormat:
    enum:
    - gguf
    - safetensors
    type: string
    x-enum-varnames:
    - FormatGGUF
    - FormatSafetensors
  models.Progress:
    properties:
      bytes_downloaded:
        type: integer
      current_file:
        type: string
      total_bytes:
        type: integer
    type: object
  server.CreateKeyRequest:
    properties:
      expires_at:
        type: integer
      name:
        type: string
      permission_mode:
        $ref: '#/definitions/auth.PermissionMode'
      permissions:
        items:
          $ref: '#/definitions/server.InstancePermissionSpec'
        type: array
    type: object
  server.CreateKeyResponse:
    properties:
      created_at:
        type: integer
      expires_at:
        type: integer
      id:
        type: integer
      key:
        type: string
      last_used_at:
        type: integer
      name:
        type: string
      permission_mode:
        $ref: '#/definitions/auth.PermissionMode'
      updated_at:
        type: integer
      user_id:
        type: string
    type: object
  server.DownloadRequest:
    properties:
      format:
        $ref: '#/definitions/models.ModelFormat'
      repo:
        type: string
    type: object
  server.DownloadResponse:
    properties:
      job_id:
        type: string
      repo:
        type: string
      tag:
        type: string
    type: object
  server.InstancePermissionSpec:
    properties:
      can_evict:
        type: boolean
      can_start:
        type: boolean
      instance_id:
        type: integer
    type: object
  server.JobResponse:
    properties:
      completed_at:
        type: integer
      created_at:
        type: integer
      error:
        type: string
      id:
        type: string
      model_path:
        type: string
      progress:
        $ref: '#/definitions/models.Progress'
      repo:
        type: string
      status:
        type: string
      tag:
        type: string
    type: object
  server.KeyPermissionResponse:
    properties:
      can_evict:
        type: boolean
      can_start:
        type: boolean
      instance_id:
        type: integer
      instance_name:
        type: string
    type: object
  server.KeyResponse:
    properties:
      created_at:
        type: integer
      expires_at:
        type: integer
      id:
        type: integer
      last_used_at:
        type: integer
      name:
        type: string
      permission_mode:
        $ref: '#/definitions/auth.PermissionMode'
      updated_at:
        type: integer
      user_id:
        type: string
    type: object
  server.ListJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/server.JobResponse'
        type: array
    type: object
  server.NodeHealthResponse:
    properties:
      checked_at:
        type: integer
      error:
        type: string
      latency_ms:
        description: 'no omitempty: 0 is meaningful (local node, sub-ms ping)'
        type: integer
      status:
        $ref: '#/definitions/server.NodeHealthStatus'
    type: object
  server.NodeHealthStatus:
    enum:
    - healthy
