site_name: Llamadeck Documentation
site_description: User documentation for Llamadeck - A management tool for Llama.cpp instances
site_author: Llamadeck Team
site_url: https://llamadeck.org

repo_name: lordmathis/llamadeck
repo_url: https://github.com/lordmathis/llamadeck

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
